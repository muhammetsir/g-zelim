<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14 Şubat ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #1a001f, #330033);
    font-family: 'Poppins', sans-serif;
    color: white;
    overflow: hidden;
    text-align: center;
}

.container {
    position: relative;
    top: 50%;
    transform: translateY(-50%);
    padding: 20px;
    animation: fadeIn 3s ease-in-out;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 4rem;
    color: #ff4d6d;
    margin-bottom: 20px;
}

p {
    font-size: 1.2rem;
    max-width: 700px;
    margin: auto;
    line-height: 1.6;
}

button {
    margin-top: 30px;
    padding: 12px 30px;
    border: none;
    border-radius: 30px;
    background: #ff4d6d;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: white;
    color: #ff4d6d;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(-40px);}
    to {opacity: 1; transform: translateY(0);}
}

/* Kalp animasyonu */
.heart {
    position: fixed;
    bottom: -10px;
    color: #ff4d6d;
    animation: floatUp 6s linear infinite;
    font-size: 20px;
}

@keyframes floatUp {
    0% {transform: translateY(0); opacity: 1;}
    100% {transform: translateY(-100vh); opacity: 0;}
}
</style>
</head>

<body>

<div class="container">
    <h1>İyi ki Varsın ❤️</h1>
    <p>
        Sen hayatıma girdiğin günden beri her şey daha anlamlı.
        Gülüşün en güzel sabahım,
        Sesin en huzurlu akşamım.
        14 Şubat sadece bir gün değil,
        Benim için sen demek...
    </p>

    <button onclick="startLove()">Sürprizi Aç 💌</button>
</div>

<script>
function startLove() {
    alert("Seni çok seviyorum ❤️ Sonsuza kadar seninleyim.");
}

function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 10 + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 400);
</script>

</body>
</html>
